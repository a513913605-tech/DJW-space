<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系金旺｜个人作品集</title>
    <style>
      :root {
        --bg: #f7f5ef;
        --text: #171717;
        --muted: #6f6a61;
        --line: rgba(23, 23, 23, 0.08);
        --accent: #f2a43a;
        --surface: rgba(255, 255, 255, 0.64);
        --surface-strong: rgba(255, 255, 255, 0.84);
        --font-body: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Segoe UI", sans-serif;
        --font-display: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        position: relative;
        isolation: isolate;
        margin: 0;
        font-family: var(--font-body);
        color: var(--text);
        letter-spacing: 0.015em;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% -8%, rgba(255, 255, 255, 0.96), transparent 30%),
          radial-gradient(circle at 50% 14%, rgba(210, 214, 214, 0.2), transparent 36%),
          linear-gradient(180deg, #fbfaf7 0%, #f2f1ec 54%, #ebe9e2 100%);
        background-size: auto;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.74), transparent 31%),
          radial-gradient(circle at 50% 50%, rgba(249, 243, 229, 0.24), transparent 56%),
          linear-gradient(90deg, rgba(31, 29, 25, 0.11), transparent 24%, transparent 76%, rgba(31, 29, 25, 0.11));
        mix-blend-mode: multiply;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(255, 255, 255, 0.48), transparent 28%),
          radial-gradient(ellipse at center, transparent 42%, rgba(34, 31, 26, 0.065) 76%, rgba(34, 31, 26, 0.13) 100%);
      }

      @keyframes fadeRise {
        from {
          opacity: 0;
          transform: translate3d(0, 18px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }

      .frame {
        position: fixed;
        inset: 20px;
        z-index: 40;
        border: 1px solid rgba(23, 23, 23, 0.08);
        pointer-events: none;
      }

      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 24px 34px;
        pointer-events: none;
        animation: fadeRise 700ms ease-out both;
      }

      .site-signature {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 11px 14px;
        border: 1px solid rgba(23, 23, 23, 0.07);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(14px);
        box-shadow: 0 12px 28px rgba(23, 23, 23, 0.035);
        color: rgba(23, 23, 23, 0.68);
        font-size: 13px;
        font-weight: 650;
        pointer-events: auto;
      }

      .site-signature::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(242, 164, 58, 0.42);
      }

      .nav__links {
        display: flex;
        gap: 6px;
        padding: 7px;
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(16px);
        box-shadow:
          0 14px 34px rgba(23, 23, 23, 0.045),
          inset 0 1px 0 rgba(255,255,255,0.8);
        font-size: 13px;
        pointer-events: auto;
      }

      .nav__links a {
        color: var(--muted);
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 999px;
        transition: color 220ms ease, background-color 220ms ease, transform 220ms ease;
      }

      .nav__links a:hover,
      .nav__links a.is-active {
        color: var(--text);
        background: rgba(255, 255, 255, 0.7);
        transform: translateY(-1px);
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 0 7vw;
      }

      .contact-screen {
        min-height: 100svh;
        display: grid;
        justify-items: center;
        align-content: center;
        text-align: center;
        animation: fadeRise 860ms ease-out 120ms both;
      }

      .contact-screen--hero {
        gap: clamp(28px, 5vh, 52px);
        padding-top: 84px;
      }

      .hero-copy {
        display: grid;
        justify-items: center;
        gap: clamp(22px, 3.5vh, 34px);
        width: 100%;
      }

      .eyebrow {
        width: fit-content;
        padding: 8px 12px;
        border: 1px solid rgba(23, 23, 23, 0.06);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.54);
        backdrop-filter: blur(12px);
        color: rgba(23, 23, 23, 0.42);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(52px, 8vw, 118px);
        line-height: 0.92;
        letter-spacing: -0.035em;
        font-weight: 760;
      }

      .subtitle {
        max-width: 680px;
        color: var(--muted);
        font-size: clamp(17px, 1.35vw, 21px);
        line-height: 2.05;
        letter-spacing: 0.032em;
      }

      .subtitle span {
        display: block;
      }

      .qr-panel {
        display: grid;
        justify-items: center;
        gap: clamp(18px, 3vh, 30px);
        width: min(100%, 720px);
      }

      .qr-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(22px, 4vw, 44px);
        width: min(100%, 520px);
      }

      .qr-card {
        display: grid;
        gap: 10px;
        justify-items: center;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
      }

      .qr-card img {
        width: 100%;
        max-width: 132px;
        aspect-ratio: 1;
        display: block;
        object-fit: cover;
        object-position: top center;
        border-radius: 8px;
      }

      .qr-card span {
        color: rgba(23, 23, 23, 0.64);
        font-size: 13px;
      }

      .mini-logo {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(23, 23, 23, 0.12);
        color: rgba(23, 23, 23, 0.46);
        font-size: 11px;
        letter-spacing: 0.16em;
        animation: glowPulse 3.4s ease-in-out infinite;
      }

      @media (max-width: 980px) {
        .qr-panel {
          max-width: 720px;
        }
      }

      @media (max-width: 720px) {
        .frame {
          inset: 12px;
        }

        .nav {
          padding: 16px;
          align-items: stretch;
          flex-direction: column;
        }

        .nav__links {
          justify-content: space-between;
        }

        .page {
          padding: 0 20px;
        }

        .contact-screen--hero {
          padding-top: 118px;
        }

        .qr-grid {
          grid-template-columns: 1fr;
          gap: 16px;
          width: min(100%, 320px);
        }

        .qr-card {
          grid-template-columns: 1fr;
          align-items: center;
          justify-items: center;
        }

        .qr-card img {
          max-width: 112px;
        }
      }
    </style>
    <link rel="stylesheet" href="assets/music-control.css" />
  </head>
  <body>
    <div class="frame"></div>

    <header class="nav">
      <div class="site-signature">Designer DJW</div>
      <div class="nav__links">
        <a href="index.html">Home</a>
        <a href="works.html">Works</a>
        <a href="about.html">About</a>
        <a class="is-active" href="contact.html">Contact</a>
      </div>
    </header>
    <div class="music-control" data-music-control>
      <button class="music-control__toggle" type="button" aria-pressed="false" aria-label="Play background music">
        <span class="music-control__icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="music-control__label">Music</span>
      </button>
      <div class="music-control__volume">
        <div class="music-control__volume-inner">
          <input class="music-control__range" type="range" min="0" max="100" value="28" aria-label="Music volume" />
          <span class="music-control__value">28%</span>
        </div>
      </div>
    </div>

    <main class="page">
      <section class="contact-screen contact-screen--hero">
        <aside class="qr-panel" aria-label="二维码联系方式">
          <div class="qr-grid">
            <div class="qr-card">
              <img src="assets/contact/qr-wechat.jpg" alt="微信二维码" />
              <span>微信</span>
            </div>
            <div class="qr-card">
              <img src="assets/contact/qr-zcool.jpg" alt="站酷二维码" />
              <span>站酷</span>
            </div>
            <div class="qr-card">
              <img src="assets/contact/qr-redbook.jpg" alt="小红书二维码" />
              <span>小红书</span>
            </div>
          </div>
        </aside>

        <div class="hero-copy">
          <div class="eyebrow">Contact / Work Together</div>
          <h1>CONTACT</h1>
          <p class="subtitle">
            <span>如果你正在寻找一位能理解需求的视觉设计师，</span>
            <span>能把控风格，并推动项目执行，</span>
            <span>欢迎联系我。</span>
          </p>
        </div>
      </section>
    </main>
    <script src="assets/music-control.js"></script>
  </body>
</html>
