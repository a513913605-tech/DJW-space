<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>作品｜金旺个人作品集</title>
    <style>
      :root {
        --bg: #f7f5ef;
        --text: #171717;
        --muted: #6f6a61;
        --line: rgba(23, 23, 23, 0.08);
        --accent: #f2a43a;
        --surface: rgba(255, 255, 255, 0.64);
        --surface-strong: rgba(255, 255, 255, 0.86);
        --font-body: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Segoe UI", sans-serif;
        --font-display: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      body {
        position: relative;
        isolation: isolate;
        margin: 0;
        font-family: var(--font-body);
        color: var(--text);
        letter-spacing: 0.015em;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% -8%, rgba(255, 255, 255, 0.96), transparent 30%),
          radial-gradient(circle at 50% 14%, rgba(210, 214, 214, 0.2), transparent 36%),
          linear-gradient(180deg, #fbfaf7 0%, #f2f1ec 54%, #ebe9e2 100%);
        background-size: auto;
      }

      body.modal-lock {
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.74), transparent 31%),
          radial-gradient(circle at 50% 50%, rgba(249, 243, 229, 0.24), transparent 56%),
          linear-gradient(90deg, rgba(31, 29, 25, 0.11), transparent 24%, transparent 76%, rgba(31, 29, 25, 0.11));
        mix-blend-mode: multiply;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(255, 255, 255, 0.48), transparent 28%),
          radial-gradient(ellipse at center, transparent 42%, rgba(34, 31, 26, 0.065) 76%, rgba(34, 31, 26, 0.13) 100%);
      }

      @keyframes fadeRise {
        from {
          opacity: 0;
          transform: translate3d(0, 18px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      .frame {
        position: fixed;
        inset: 20px;
        z-index: 40;
        border: 1px solid rgba(23, 23, 23, 0.08);
        pointer-events: none;
      }

      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 24px 34px;
        pointer-events: none;
        animation: fadeRise 700ms ease-out both;
      }

      .site-signature {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 11px 14px;
        border: 1px solid rgba(23, 23, 23, 0.07);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(14px);
        box-shadow: 0 12px 28px rgba(23, 23, 23, 0.035);
        color: rgba(23, 23, 23, 0.68);
        font-size: 13px;
        font-weight: 650;
        pointer-events: auto;
      }

      .site-signature::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(242, 164, 58, 0.42);
      }

      .nav__links {
        display: flex;
        gap: 6px;
        padding: 7px;
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(16px);
        box-shadow:
          0 14px 34px rgba(23, 23, 23, 0.045),
          inset 0 1px 0 rgba(255,255,255,0.8);
        font-size: 13px;
        pointer-events: auto;
      }

      .nav__links a {
        color: var(--muted);
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 999px;
        transition: color 220ms ease, background-color 220ms ease, transform 220ms ease;
      }

      .nav__links a:hover,
      .nav__links a.is-active {
        color: var(--text);
        background: rgba(255, 255, 255, 0.7);
        transform: translateY(-1px);
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 132px 34px 84px;
      }

      .works-hero {
        display: block;
        padding: clamp(42px, 7vh, 82px) 0 clamp(34px, 6vh, 68px);
        animation: fadeRise 760ms ease-out 80ms both;
      }

      .hero-copy {
        display: grid;
        gap: 24px;
        max-width: 820px;
      }

      .eyebrow {
        width: fit-content;
        color: rgba(23, 23, 23, 0.42);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(62px, 9vw, 132px);
        line-height: 0.92;
        letter-spacing: -0.035em;
        font-weight: 760;
      }

      .lead {
        max-width: 720px;
        color: var(--muted);
        font-size: clamp(17px, 1.25vw, 20px);
        line-height: 1.9;
        letter-spacing: 0.035em;
      }

      .filter-panel {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 4px 0 34px;
        animation: fadeRise 760ms ease-out 160ms both;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 0;
        max-width: min(100%, 980px);
      }

      .chip {
        position: relative;
        min-height: 38px;
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.42);
        color: var(--muted);
        padding: 9px 15px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.2;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(23, 23, 23, 0.026);
        transition:
          color 200ms ease,
          border-color 200ms ease,
          background-color 200ms ease,
          box-shadow 200ms ease,
          transform 200ms ease;
      }

      .chip:hover,
      .chip.is-active {
        color: var(--text);
        border-color: rgba(23, 23, 23, 0.14);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 10px 26px rgba(23, 23, 23, 0.04);
        transform: translateY(-1px);
      }

      .chip::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 6px;
        height: 1px;
        background: currentColor;
        opacity: 0;
        transform: scaleX(0.36);
        transition: opacity 200ms ease, transform 200ms ease;
      }

      .chip:hover::after,
      .chip.is-active::after {
        opacity: 0.46;
        transform: scaleX(1);
      }

      .work-section {
        position: relative;
        z-index: 2;
        display: grid;
        gap: clamp(18px, 2.4vw, 30px);
      }

      .work-section + .work-section {
        margin-top: clamp(54px, 6vw, 92px);
      }

      .work-section__header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
        padding-bottom: 2px;
      }

      .work-section__header h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 48px;
        line-height: 1;
        letter-spacing: 0;
      }

      .work-section__header p {
        max-width: 520px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        letter-spacing: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .work-archive {
        position: relative;
        display: block;
        width: 100%;
        min-height: 520px;
      }

      .work-card {
        position: relative;
        display: grid;
        align-content: end;
        width: 100%;
        min-height: auto;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: clamp(22px, 2vw, 32px);
        background: #e9e2d4;
        box-shadow: 0 16px 34px rgba(23, 23, 23, 0.045);
        cursor: pointer;
        opacity: 0;
        animation: fadeRise 720ms ease-out forwards;
        transition: transform 240ms ease, box-shadow 240ms ease, border-color 240ms ease, filter 240ms ease;
      }

      .work-archive.is-masonry .work-card {
        position: absolute;
        left: 0;
        top: 0;
        aspect-ratio: auto;
        animation: none;
        will-change: transform, width, height, opacity, filter;
      }

      .work-card[hidden] {
        display: none;
      }

      .work-card:hover {
        transform: translateY(-8px);
        border-color: rgba(242, 164, 58, 0.24);
        box-shadow:
          0 24px 52px rgba(23, 23, 23, 0.075),
          0 0 40px rgba(242, 164, 58, 0.11);
        filter: saturate(1.03) brightness(1.015);
      }

      .work-card.is-transition-source {
        opacity: 0 !important;
      }

      .work-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(23, 23, 23, 0.02) 0%, transparent 42%, rgba(23, 23, 23, 0.58) 100%),
          radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.16), transparent 26%);
        pointer-events: none;
      }

      .work-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translateZ(0);
      }

      .work-card__content {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 8px;
        padding: clamp(18px, 2vw, 26px);
        color: #fff;
      }

      .work-card__meta {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.76);
      }

      .work-card__title {
        font-size: clamp(22px, 2.2vw, 34px);
        line-height: 1.08;
        letter-spacing: -0.018em;
        font-weight: 700;
      }

      .work-card__desc {
        max-width: 420px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 13px;
        line-height: 1.62;
        letter-spacing: 0.03em;
      }

      .work-card__hint {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 2;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: var(--text);
        font-size: 16px;
        backdrop-filter: blur(10px);
      }

      .archive-card {
        border-radius: clamp(16px, 1.45vw, 22px);
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.04);
        content-visibility: auto;
        contain-intrinsic-size: 260px 195px;
      }

      .work-archive.is-masonry .archive-card {
        content-visibility: visible;
        contain-intrinsic-size: auto;
      }

      .archive-card .work-card__content {
        gap: 5px;
        padding: clamp(14px, 1.35vw, 18px);
      }

      .archive-card .work-card__meta {
        font-size: 10px;
        letter-spacing: 0;
      }

      .archive-card .work-card__title {
        font-size: 18px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .archive-card .work-card__desc {
        display: none;
      }

      .archive-card .work-card__hint {
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .work-card--video .work-card__hint,
      .archive-card.work-card--video .work-card__hint {
        width: auto;
        min-width: 62px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.12em;
      }

      .work-card:nth-child(1) { animation-delay: 70ms; }
      .work-card:nth-child(2) { animation-delay: 120ms; }
      .work-card:nth-child(3) { animation-delay: 170ms; }
      .work-card:nth-child(4) { animation-delay: 220ms; }
      .work-card:nth-child(5) { animation-delay: 270ms; }
      .work-card:nth-child(6) { animation-delay: 320ms; }
      .work-card:nth-child(7) { animation-delay: 370ms; }
      .work-card:nth-child(8) { animation-delay: 420ms; }
      .work-card:nth-child(9) { animation-delay: 470ms; }
      .work-card:nth-child(10) { animation-delay: 520ms; }
      .work-card:nth-child(11) { animation-delay: 570ms; }
      .work-card:nth-child(12) { animation-delay: 620ms; }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(247, 245, 239, 0.78);
        backdrop-filter: blur(20px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .modal.is-open {
        pointer-events: auto;
      }

      .modal__panel {
        position: relative;
        width: min(1120px, 100%);
        max-height: min(92vh, 920px);
        overflow-y: auto;
        display: block;
        border: 1px solid rgba(23, 23, 23, 0.06);
        border-radius: clamp(18px, 2vw, 24px);
        background: #fff;
        box-shadow: 0 26px 80px rgba(23, 23, 23, 0.15);
        transform-origin: center;
        will-change: transform, opacity;
        opacity: 0;
      }

      .modal-transition-ghost {
        position: fixed;
        z-index: 90;
        overflow: hidden;
        pointer-events: none;
        border: 1px solid rgba(23, 23, 23, 0.08);
        background: #e9e2d4;
        box-shadow: 0 26px 80px rgba(23, 23, 23, 0.16);
        transform-origin: center;
        will-change: left, top, width, height, border-radius, opacity;
      }

      .modal-transition-ghost::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(23, 23, 23, 0.02) 0%, transparent 42%, rgba(23, 23, 23, 0.5) 100%),
          radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.16), transparent 26%);
        pointer-events: none;
      }

      .modal-transition-ghost img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .modal-transition-ghost .work-card__content,
      .modal-transition-ghost .work-card__hint {
        position: absolute;
      }

      .modal-transition-ghost .work-card__content {
        left: 0;
        right: 0;
        bottom: 0;
      }

      .modal-transition-mask {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: #000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        will-change: opacity;
      }

      .modal__visual {
        height: clamp(210px, 30vh, 330px);
        overflow: hidden;
        background: #171717;
      }

      .modal__visual img,
      .modal__visual video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }

      .modal__visual video {
        background: #05070b;
      }

      .modal__info {
        display: grid;
        gap: clamp(42px, 5vw, 68px);
        padding: clamp(34px, 5vw, 64px) clamp(24px, 4vw, 48px) 58px;
      }

      .modal__copy {
        display: grid;
        gap: 10px;
      }

      .modal__eyebrow {
        color: rgba(23, 23, 23, 0.46);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .modal__title {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(40px, 6.5vw, 78px);
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: 0;
      }

      .modal__desc {
        margin: 0;
        color: rgba(23, 23, 23, 0.48);
        max-width: 720px;
        font-size: 14px;
        line-height: 1.65;
        letter-spacing: 0.02em;
      }

      .modal__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        padding-top: 6px;
      }

      .modal__tags span {
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: 999px;
        padding: 6px 10px;
        color: rgba(23, 23, 23, 0.55);
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0.04em;
        background: rgba(247, 245, 239, 0.72);
      }

      .project-brief {
        display: grid;
        gap: clamp(54px, 6.5vw, 86px);
      }

      .project-overview {
        display: grid;
        gap: clamp(42px, 5vw, 64px);
      }

      .project-brief__grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .project-brief__item,
      .project-brief__wide,
      .project-brief__lead {
        border: 1px solid rgba(23, 23, 23, 0.07);
        border-radius: 8px;
        background: #fff;
        padding: clamp(16px, 2vw, 22px);
      }

      .project-overview .project-brief__lead {
        border: 0;
        border-radius: 0;
        padding: 0;
        background: transparent;
      }

      .project-brief__wide,
      .project-brief__lead {
        display: grid;
        gap: 12px;
      }

      .project-brief__label,
      .project-brief__lead h3 {
        display: block;
        margin: 0 0 2px;
        color: rgba(23, 23, 23, 0.48);
        font-size: 12px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .project-overview .project-brief__label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        justify-self: center;
        color: rgba(23, 23, 23, 0.92);
        border: 1px solid rgba(23, 23, 23, 0.13);
        border-radius: 999px;
        padding: 9px 18px 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        font-size: clamp(18px, 1.9vw, 24px);
        line-height: 1.25;
        font-weight: 760;
        letter-spacing: 0;
        text-align: center;
        text-transform: none;
      }

      .project-brief__item p,
      .project-brief__wide p,
      .project-brief__lead p {
        margin: 0;
        color: rgba(23, 23, 23, 0.76);
        font-size: 14px;
        line-height: 1.78;
        letter-spacing: 0.02em;
      }

      .project-section {
        display: grid;
        gap: clamp(20px, 2.5vw, 30px);
        padding-top: 2px;
      }

      .project-section__heading {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        justify-self: center;
        margin: 0;
        min-width: min(210px, 78vw);
        border: 1px solid rgba(23, 23, 23, 0.13);
        border-radius: 999px;
        padding: 9px 20px 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        color: rgba(23, 23, 23, 0.92);
        font-size: clamp(18px, 1.9vw, 24px);
        line-height: 1.35;
        font-weight: 760;
        letter-spacing: 0;
        text-align: center;
      }

      .project-section__body {
        display: grid;
        gap: 14px;
      }

      .project-brief__output {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .project-brief__output li {
        border: 1px solid rgba(23, 23, 23, 0.07);
        border-radius: 8px;
        padding: 12px 14px;
        background: rgba(23, 23, 23, 0.055);
        color: rgba(23, 23, 23, 0.72);
        font-size: 13px;
        line-height: 1.45;
      }

      .project-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding-top: 4px;
      }

      .project-gallery figure {
        margin: 0;
        overflow: hidden;
        background: #171717;
        border-radius: 8px;
      }

      .project-gallery figure.is-wide {
        grid-column: 1 / -1;
      }

      .project-gallery img,
      .project-gallery video {
        display: block;
        width: 100%;
        height: auto;
      }

      .project-gallery video {
        background: #05070b;
      }

      .back-to-top {
        justify-self: center;
        min-width: 210px;
        margin: 24px 0 2px;
        border-color: rgba(23, 23, 23, 0.08);
        background: rgba(255, 255, 255, 0.64);
      }

      .ghost-btn {
        border: 1px solid rgba(23, 23, 23, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--text);
        padding: 11px 16px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: border-color 220ms ease, background-color 220ms ease, box-shadow 220ms ease;
      }

      .ghost-btn:hover {
        border-color: rgba(242, 164, 58, 0.26);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 24px rgba(242, 164, 58, 0.1);
      }

      .close-btn {
        position: sticky;
        top: 18px;
        z-index: 8;
        display: flex;
        width: max-content;
        margin: 18px 18px -70px auto;
        min-width: 118px;
        padding: 15px 24px;
        font-size: 18px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 28px rgba(23, 23, 23, 0.12);
      }

        image.src = image.dataset.src;
        image.removeAttribute("data-src");
      }

      function initArchiveImageLoading() {
        const deferredImages = Array.from(document.querySelectorAll(".archive-card img[data-src]"));
        if (!deferredImages.length) return;

        if (!("IntersectionObserver" in window)) {
          deferredImages.forEach(hydrateArchiveImage);
          return;
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            hydrateArchiveImage(entry.target);
            observer.unobserve(entry.target);
          });
        }, {
          rootMargin: "900px 0px"
        });

        deferredImages.forEach((image) => observer.observe(image));
      }

      const hasGSAP = Boolean(window.gsap);

        });

      function getMasonryColumns(width) {
        if (width >= 1500) return 5;
        if (width >= 1000) return 4;
        if (width >= 600) return 3;
        if (width >= 420) return 2;
        return 1;
      }

      function getMasonryRatio(card) {
        const ratios = [1.36, 0.92, 1.18, 1.52, 1.04, 1.28, 0.84, 1.42, 1.1, 1.62, 0.98, 1.22];
        const index = Number.parseInt(card.dataset.masonryIndex || "0", 10) || 0;
        if (window.innerWidth < 520) return 0.86;
        return ratios[index % ratios.length];
      }

      function layoutMasonry() {
        const archive = document.querySelector(".work-archive");
        if (!archive) return;

        archive.classList.add("is-masonry");
        const visibleCards = cards.filter((card) => !card.hidden);
        const hiddenCards = cards.filter((card) => card.hidden);
        const width = archive.clientWidth;
        if (!width) return;

        const columns = getMasonryColumns(width);
        const gap = window.innerWidth <= 760 ? 12 : 18;
        const columnWidth = (width - gap * (columns - 1)) / columns;
        const columnHeights = new Array(columns).fill(0);
        const firstLayout = !archive.dataset.masonryReady;

        hiddenCards.forEach((card) => {
          if (hasGSAP && !reduceMotion) {
            gsap.to(card, {
              autoAlpha: 0,
              scale: 0.96,
              filter: "blur(8px)",
              duration: 0.22,
              ease: "power2.out",
              overwrite: true
            });
          } else {
            card.style.opacity = "0";
          }
        });

        visibleCards.forEach((card, index) => {
          const column = columnHeights.indexOf(Math.min(...columnHeights));
          const x = column * (columnWidth + gap);
          const height = Math.max(180, Math.round(columnWidth * getMasonryRatio(card)));
          const y = columnHeights[column];
          columnHeights[column] += height + gap;

      function applyFilter(filter) {
        chips.forEach((chip) => chip.classList.toggle("is-active", chip.dataset.filter === filter));
        cards.forEach((card) => {
          const categories = (card.dataset.category || "").split(" ");
          card.hidden = filter !== "all" && !categories.includes(filter);
        });
        layoutMasonry();
      }

      function setModalLock(locked) {
        document.body.classList.toggle("modal-lock", locked);
      }

      function getCardRadius(card) {
        return window.getComputedStyle(card).borderRadius || "28px";
      }

      function createTransitionGhost(card) {
        const rect = card.getBoundingClientRect();
        const ghost = document.createElement("div");
        const image = card.querySelector("img");
        const content = card.querySelector(".work-card__content");
        const hint = card.querySelector(".work-card__hint");

        ghost.className = "modal-transition-ghost";
        ghost.style.left = `${rect.left}px`;
        ghost.style.top = `${rect.top}px`;
        ghost.style.width = `${rect.width}px`;
        ghost.style.height = `${rect.height}px`;
        ghost.style.borderRadius = getCardRadius(card);

        if (image) {
          const ghostImage = image.cloneNode(true);
          ghostImage.removeAttribute("loading");
          ghost.appendChild(ghostImage);
        }

        if (hint) {
          ghost.appendChild(hint.cloneNode(true));
        }

        if (content) {
          ghost.appendChild(content.cloneNode(true));
        }

        const mask = document.createElement("div");
        mask.className = "modal-transition-mask";
        ghost.appendChild(mask);

        document.body.appendChild(ghost);
        return ghost;
      }

      function getPanelRadius() {
        return window.getComputedStyle(modalPanel).borderRadius || "16px";
      }

      function showModalInstant() {
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        setModalLock(true);
        modalPanel.scrollTop = 0;
      }

      function hideModalInstant() {
        resetModalMedia();
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        setModalLock(false);
        activeCard?.classList.remove("is-transition-source");
        activeCard = null;
        isModalAnimating = false;
      }

      function animateOpen(card) {
        if (!hasGSAP || reduceMotion) {
          showModalInstant();
          modal.style.opacity = "1";
          modal.style.visibility = "visible";
          modalPanel.style.opacity = "1";
          isModalAnimating = false;
          return;
        }

        const ghost = createTransitionGhost(card);
        showModalInstant();
        const ghostContent = ghost.querySelector(".work-card__content");
        const ghostMask = ghost.querySelector(".modal-transition-mask");
        const targetRect = modalPanel.getBoundingClientRect();
        const targetRadius = getPanelRadius();

        card.classList.add("is-transition-source");
        gsap.killTweensOf([modal, modalPanel, ghost, ghostContent, ghostMask]);
        gsap.set(modal, { autoAlpha: 0 });
        gsap.set(modalPanel, { autoAlpha: 0, y: 18, scale: 0.985 });
        gsap.set(ghostMask, { autoAlpha: 0 });

        gsap.timeline({
          defaults: { overwrite: "auto" },
          onComplete: () => {
            ghost.remove();
            card.classList.remove("is-transition-source");
            gsap.set(modalPanel, { clearProps: "transform,visibility" });
            isModalAnimating = false;
          }
        })
          .to(modal, { autoAlpha: 1, duration: 0.24, ease: "power2.out" }, 0)
          .to(ghost, {
            left: targetRect.left,
            top: targetRect.top,
            width: targetRect.width,
            height: targetRect.height,
            borderRadius: targetRadius,
            duration: 0.74,
            ease: "expo.out"
          }, 0.02)
          .to(ghostContent, { autoAlpha: 0, y: -10, duration: 0.16, ease: "power2.out" }, 0.02)
          .to(ghostMask, { autoAlpha: 1, duration: 0.08, ease: "power2.out" }, 0.02)
          .to(modalPanel, {
            autoAlpha: 1,
            y: 0,
            scale: 1,
            duration: 0.26,
            ease: "power3.out"
          }, 0.5)
          .to(ghost, { autoAlpha: 0, duration: 0.22, ease: "power2.inOut" }, 0.58);
      }

      function animateClose() {
        if (!activeCard) return Promise.resolve();

        if (!hasGSAP || reduceMotion) {
          hideModalInstant();
          modal.style.opacity = "";
          modal.style.visibility = "";
          modalPanel.style.opacity = "";
          return Promise.resolve();
        }

        const card = activeCard;
        const ghost = createTransitionGhost(card);
        const ghostContent = ghost.querySelector(".work-card__content");
        const ghostMask = ghost.querySelector(".modal-transition-mask");
        const panelRect = modalPanel.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();

        card.classList.add("is-transition-source");
        gsap.killTweensOf([modal, modalPanel, ghost, ghostContent, ghostMask]);
        gsap.set(ghost, {
          left: panelRect.left,
          top: panelRect.top,
          width: panelRect.width,
          height: panelRect.height,
          borderRadius: getPanelRadius(),
          autoAlpha: 0
        });
        gsap.set(ghostMask, { autoAlpha: 1 });
        gsap.set(ghostContent, { autoAlpha: 0, y: 10 });

        return new Promise((resolve) => {
          gsap.timeline({
            defaults: { overwrite: "auto" },
            onComplete: () => {
              ghost.remove();
              modal.classList.remove("is-open");
              modal.setAttribute("aria-hidden", "true");
              setModalLock(false);
              gsap.set([modal, modalPanel], { clearProps: "opacity,visibility,transform" });
              resetModalMedia();
              card.classList.remove("is-transition-source");
              activeCard = null;
              isModalAnimating = false;
              resolve();
            }
          })
            .to(modalPanel, {
              autoAlpha: 0,
              y: 12,
              scale: 0.985,
              duration: 0.18,
              ease: "power2.in"
            }, 0)
            .to(ghost, { autoAlpha: 1, duration: 0.1, ease: "power1.out" }, 0.04)
            .to(ghostMask, { autoAlpha: 0, duration: 0.16, ease: "power2.inOut" }, 0.1)
            .to(ghost, {
              left: cardRect.left,
              top: cardRect.top,
              width: cardRect.width,
              height: cardRect.height,
              borderRadius: getCardRadius(card),
              duration: 0.52,
              ease: "power3.inOut"
            }, 0.1)
            .to(ghostContent, { autoAlpha: 1, y: 0, duration: 0.16, ease: "power2.out" }, 0.42)
            .to(modal, { autoAlpha: 0, duration: 0.28, ease: "power2.inOut" }, 0.34);
        });
      }

      function getQuickWorkDetail(card) {
        if (card.dataset.quickWork !== "true") return {};

        const image = card.dataset.image || "";
        return {
          hero: image,
          gallery: [{ src: image, wide: true }],
          position: card.dataset.type || "作品归档 / 单张作品",
          background: "该作品来自完整作品归档，目前先以单张作品卡片形式展示，方便快速浏览和后续筛选整理。",
          role: "负责对应画面的视觉设计与作品输出。",
          businessGoal: "先完成作品页面的基础填充，让不同方向作品可以被独立浏览。",
          designGoal: "保持单张作品展示清晰，后续可继续补充更完整的项目背景、职责和设计说明。",
          capability: "视觉执行、画面表现、风格控制与作品归档整理。",
          approach: "当前版本先按原作品页顺序粗排展示。",
          outputs: ["单张作品展示", "作品归档图", "后续可补充项目说明"]
        };
      }

      function openModal(card) {
        if (isModalAnimating || modal.classList.contains("is-open")) return;
        isModalAnimating = true;
        activeCard = card;
        hydrateArchiveImage(card.querySelector("img[data-src]"));
        const detail = projectDetails[card.dataset.detailKey] || projectDetails[card.dataset.title] || getQuickWorkDetail(card);
        const heroImage = detail.hero || card.dataset.image || "";
        const heroVideo = detail.video || card.dataset.video || "";
        resetModalMedia();
        if (modalVideo) {
          modalVideo.poster = heroImage;
          modalVideo.hidden = !heroVideo;
          if (heroVideo) {
            modalVideo.src = heroVideo;
            modalVideo.load();
          }
        }
        modalImage.hidden = Boolean(heroVideo);
        modalImage.src = heroVideo ? "" : heroImage;
        modalImage.alt = card.dataset.title || "";
        modalTitle.textContent = card.dataset.title || "";
        modalType.textContent = card.dataset.type || "";
        modalDesc.textContent = card.dataset.desc || "";
        modalTags.innerHTML = (card.dataset.tags || "")
          .split("/")
          .filter(Boolean)
          .map((tag) => `<span>${tag.trim()}</span>`)
          .join("");
        modalBackground.textContent = detail.background || "项目背景信息待补充。";
        modalRole.textContent = detail.role || "项目职责信息待补充。";
        modalPosition.textContent = detail.position || card.dataset.type || "项目定位信息待补充。";
        modalBusinessGoal.textContent = detail.businessGoal || "业务目标信息待补充。";
        modalDesignGoal.textContent = detail.designGoal || "设计目标信息待补充。";
        modalCapability.textContent = detail.capability || "能力体现信息待补充。";
        modalApproach.textContent = detail.approach || "设计思路信息待补充。";
        modalOutputs.innerHTML = (detail.outputs || ["关键产出待补充"])
          .map((output) => `<li>${output}</li>`)
          .join("");
        modalGallery.innerHTML = (detail.gallery || [{ src: card.dataset.image || "", wide: true }])
          .filter((item) => item.src)
          .map((item) => `
            <figure class="${item.wide ? "is-wide" : ""}">
              ${item.type === "video"
                ? `<video src="${item.src}" poster="${item.poster || heroImage}" controls playsinline preload="metadata"></video>`
                : `<img src="${item.src}" alt="${card.dataset.title || "项目图片"}" loading="lazy" decoding="async" />`}
            </figure>
          `)
          .join("");
        requestAnimationFrame(() => animateOpen(card));
      }

      async function hideModal() {
        if (isModalAnimating || !modal.classList.contains("is-open")) return;
        isModalAnimating = true;
        await animateClose();
      }

      chips.forEach((chip) => chip.addEventListener("click", () => applyFilter(chip.dataset.filter)));
      cards.forEach((card) => {
        card.addEventListener("pointerenter", () => {
          if (!hasGSAP || reduceMotion || card.hidden || card.classList.contains("is-transition-source")) return;
          gsap.to(card, {
            scale: 0.95,
            duration: 0.3,
            ease: "power2.out",
            overwrite: "auto"
          });
        });
        card.addEventListener("pointerleave", () => {
          if (!hasGSAP || reduceMotion || card.hidden || card.classList.contains("is-transition-source")) return;
          gsap.to(card, {
            scale: 1,
            duration: 0.3,
            ease: "power2.out",
            overwrite: "auto"
          });
        });
        card.addEventListener("click", () => openModal(card));
      });
      layoutMasonry();
      let masonryResizeFrame = null;
      window.addEventListener("resize", () => {
        if (masonryResizeFrame) return;
        masonryResizeFrame = requestAnimationFrame(() => {
          masonryResizeFrame = null;
          layoutMasonry();
        });
      });
      closeModal.addEventListener("click", hideModal);
      modalBackTop.addEventListener("click", () => modalPanel.scrollTo({ top: 0, behavior: "smooth" }));

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          hideModal();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) {
          hideModal();
        }
      });
    </script>
