<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>无限画布｜DJW Design AI Workflow</title>
    <style>
      :root {
        --bg: #07090d;
        --bg-soft: #0d1118;
        --panel: rgba(16, 20, 28, 0.72);
        --text: rgba(246, 247, 250, 0.96);
        --muted: rgba(214, 220, 230, 0.68);
        --line: rgba(232, 238, 248, 0.11);
        --accent: #f2a43a;
        --surface: rgba(16, 20, 28, 0.58);
        --surface-strong: rgba(22, 27, 36, 0.86);
        --font: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 50% -12%, rgba(118, 136, 168, 0.2), transparent 30%),
          radial-gradient(circle at 50% 34%, rgba(242, 164, 58, 0.08), transparent 34%),
          linear-gradient(180deg, #07090d 0%, #0d1118 48%, #07090d 100%);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        z-index: 0;
        background:
          linear-gradient(90deg, rgba(232, 238, 248, 0.055) 1px, transparent 1px),
          linear-gradient(180deg, rgba(232, 238, 248, 0.04) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at 50% 46%, rgba(0, 0, 0, 0.78), transparent 72%);
      }

      body::after {
        z-index: 1;
        border: 1px solid rgba(232, 238, 248, 0.12);
        inset: 20px;
      }

      button,
      a {
        font: inherit;
      }

      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: calc(env(safe-area-inset-top, 0px) + 20px) 34px 14px;
        pointer-events: none;
      }

      .site-signature,
      .nav__links,
      .canvas-status {
        border: 1px solid var(--line);
        background:
          radial-gradient(circle at 18% 12%, rgba(164, 184, 220, 0.08), transparent 36%),
          rgba(16, 20, 28, 0.66);
        box-shadow:
          0 28px 78px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(18px);
        pointer-events: auto;
      }

      .site-signature {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        padding: 0 14px;
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .site-signature::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(242, 164, 58, 0.5);
      }

      .nav__links {
        display: flex;
        gap: 6px;
        padding: 7px;
        border-radius: 999px;
      }

      .nav__links a {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 15px;
        border-radius: 999px;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        transition: color 220ms ease, background-color 220ms ease, transform 220ms ease;
        white-space: nowrap;
      }

      .nav__links a:hover,
      .nav__links .is-active {
        color: var(--text);
        background: rgba(232, 238, 248, 0.1);
        transform: translateY(-1px);
      }

      .canvas-status {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-radius: 999px;
        color: rgba(232, 238, 248, 0.74);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .canvas-status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #6ee7b7;
        box-shadow: 0 0 18px rgba(110, 231, 183, 0.46);
      }

      .canvas-shell {
        position: fixed;
        inset: 86px 20px 20px;
        z-index: 10;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #2d3033;
      }

      .canvas-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #2d3033;
      }

      .fallback {
        position: fixed;
        inset: 86px 20px 20px;
        z-index: 9;
        display: grid;
        place-items: center;
        padding: 24px;
        color: rgba(232, 238, 248, 0.72);
        text-align: center;
        background: #2d3033;
      }

      .fallback__box {
        width: min(460px, 100%);
        display: grid;
        gap: 14px;
      }

      .fallback h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(28px, 5vw, 58px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .fallback p {
        margin: 0;
        line-height: 1.7;
      }

      .fallback a {
        width: fit-content;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        justify-self: center;
        padding: 0 18px;
        border: 1px solid rgba(242, 164, 58, 0.38);
        border-radius: 999px;
        color: var(--text);
        background: rgba(242, 164, 58, 0.16);
        text-decoration: none;
        font-weight: 800;
      }

      @media (max-width: 900px) {
        body::after {
          inset: 12px;
        }

        .nav {
          left: 12px;
          right: 12px;
          display: grid;
          grid-template-columns: 1fr;
          justify-items: center;
          padding: calc(env(safe-area-inset-top, 0px) + 14px) 0 10px;
        }

        .site-signature,
        .canvas-status {
          display: none;
        }

        .nav__links {
          width: 100%;
          overflow-x: auto;
          justify-content: space-between;
          scrollbar-width: none;
        }

        .nav__links::-webkit-scrollbar {
          display: none;
        }

        .nav__links a {
          flex: 1;
          min-width: max-content;
          padding: 0 10px;
          font-size: 12px;
        }

        .canvas-shell,
        .fallback {
          inset: 78px 12px 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <a class="site-signature" href="index.html">Designer DJW</a>
      <nav class="nav__links" aria-label="站点导航">
        <a href="index.html">Home</a>
        <a href="works.html">Works</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a class="is-active" href="infinite-canvas.html">无限画布</a>
      </nav>
      <a class="canvas-status" href="http://localhost:8000/flow-v0/?id=iwqYhPLtiXWpZCe1ncf0Z" target="_blank" rel="noreferrer">DJW Design AI Workflow</a>
    </header>

    <main class="canvas-shell" aria-label="无限画布">
      <iframe class="canvas-frame" title="DJW Design AI Workflow" allow="clipboard-read; clipboard-write"></iframe>
    </main>

    <section class="fallback" aria-hidden="true">
      <div class="fallback__box">
        <h1>无限画布</h1>
        <p>DJW Design AI Workflow</p>
        <a href="http://localhost:8000/flow-v0/?id=iwqYhPLtiXWpZCe1ncf0Z" target="_blank" rel="noreferrer">打开画布</a>
      </div>
    </section>

    <script>
      (function () {
        const iframe = document.querySelector(".canvas-frame");
        const statusLink = document.querySelector(".canvas-status");
        const querySource = new URLSearchParams(window.location.search).get("flow");
        const localSource = "http://localhost:8000/flow-v0/?id=iwqYhPLtiXWpZCe1ncf0Z";
        const bundledSource = "flow-v0/?id=iwqYhPLtiXWpZCe1ncf0Z";
        const isLocalPreview = ["", "localhost", "127.0.0.1"].includes(window.location.hostname) || window.location.protocol === "file:";
        const source = querySource || (isLocalPreview ? localSource : bundledSource);
        iframe.src = source;
        statusLink.href = source;
      })();
    </script>
  </body>
</html>
